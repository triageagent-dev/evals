apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentevals
  labels:
    {{- include "agentevals.labels" . | nindent 4 }}
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentevals
  template:
    metadata:
      labels:
        {{- include "agentevals.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agentevals
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --addr=:8001
            - --otlp-addr=:4318
            - --otlp-grpc-addr=:4317
            - --health-addr=:9090
            - --session-db=/data/{{ .Values.persistence.dbFile }}
            {{- with .Values.adminGithubUsers }}
            - --admin-github-users={{ join "," . }}
            {{- end }}
          env:
            - name: AGENTEVALS_GITHUB_CLIENT_ID
              value: {{ .Values.auth.githubClientId | quote }}
            - name: AGENTEVALS_GITHUB_ORG
              value: {{ .Values.auth.githubOrg | quote }}
            - name: AGENTEVALS_PUBLIC_URL
              value: {{ .Values.auth.publicUrl | quote }}
            - name: AGENTEVALS_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.githubClientSecret }}
                  key: GITHUB_CLIENT_SECRET
            - name: AGENTEVALS_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.sessionSecret }}
                  key: SESSION_SECRET
            {{- if .Values.vertex.enabled }}
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.vertex.project | quote }}
            - name: GOOGLE_CLOUD_LOCATION
              value: {{ .Values.vertex.location | quote }}
            {{- end }}
            {{- with .Values.jevSecret }}
            - name: JEV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: JEV_API_KEY
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8001
            - name: otlp-http
              containerPort: 4318
            - name: otlp-grpc
              containerPort: 4317
            - name: health
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /api/health
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: session-db
              mountPath: /data
      volumes:
        - name: session-db
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
